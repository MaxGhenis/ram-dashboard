name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  v2-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: swift test

  v2-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release and bundle app
        run: |
          swift build -c release
          scripts/bundle-app.sh release

  v1-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests (SPM)
        run: cd RAMBar && swift test

  v1-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app (xcodebuild)
        run: |
          cd RAMBar
          xcodebuild -scheme RAMBar -configuration Release -derivedDataPath build build
